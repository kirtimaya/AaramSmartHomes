spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public

  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase JWKS endpoint — tokens are RS256, JWKS is auto-fetched
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          issuer-uri: ${SUPABASE_URL}/auth/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}

app:
  supabase-url: ${SUPABASE_URL}
  supabase-service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  admin-email: ${ADMIN_EMAIL:admin@aaramsmarthomes.com}
  groq-api-key: ${GROQ_API_KEY:}
  groq-model: llama-3.3-70b-versatile
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  tasks-secret: ${TASKS_SECRET:}
  public-base-url: ${PUBLIC_BASE_URL:}
  google-tts-api-key: ${GOOGLE_TTS_API_KEY:}
  google-tts-voice: ${GOOGLE_TTS_VOICE:hi-IN-Wavenet-D}
  emergency-contact-number: ${EMERGENCY_CONTACT_NUMBER:}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    api-version: ${WHATSAPP_API_VERSION:v23.0}
    feedback-flow-id: ${WHATSAPP_FEEDBACK_FLOW_ID:}
